name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # test: run on every push and PR, across all supported platforms + versions
  # ---------------------------------------------------------------------------
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install csttool with test dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -x -q

  # ---------------------------------------------------------------------------
  # report-pdf: the one-page A4 PDF report gate. WeasyPrint's native deps are
  # heavy, so it is a dedicated single-platform job (not in the OS/version
  # matrix). It installs the [reports] extra + pypdf and runs the PDF
  # structural tests (exactly one A4 page, content, git-commit absence).
  # ---------------------------------------------------------------------------
  report-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install csttool with report + test dependencies
        run: pip install -e ".[test,reports]"
      # The whole report-layout file, not just the -k "pdf" subset: this is the
      # only job with WeasyPrint installed, so it is where the one-page gate,
      # the headroom budget and the figure-geometry assertions all really run.
      - name: Run report layout + PDF tests
        run: pytest tests/metrics/test_report_layout.py -q

  # ---------------------------------------------------------------------------
  # publish: triggered on a v* tag only, after tests pass
  #
  # Prerequisites (one-time setup on PyPI):
  #   1. Create the csttool project on https://pypi.org
  #   2. Under the project > Settings > Publishing, add a Trusted Publisher:
  #        Owner:    alemnalo
  #        Repo:     csttool
  #        Workflow: ci.yml
  #        Environment: (leave blank)
  #   This replaces API token auth with keyless OIDC — no secrets to manage.
  # ---------------------------------------------------------------------------
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write  # required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hatch
        run: pip install hatch

      - name: Build distributions
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
